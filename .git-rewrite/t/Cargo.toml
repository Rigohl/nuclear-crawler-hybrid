[package]
name = "nuclear-crawler-hybrid"
version = "0.1.0"
edition = "2021"
authors = ["DELL <nuclear-mcp@localhost>"]
description = "🔥 NUCLEAR MCP - Motor de búsqueda libre más potente con servidor HTTP Axum. 23 módulos integrados: Go FFI (100K goroutines), Zig SIMD, JAX GPU, Mojo, Stealth, Nuclear Bypass, Real Search Engines (DuckDuckGo/Bing/Brave/SearX), Deep Web, HuggingFace. Protocolo MCP 2025-06-18."
documentation = "https://github.com/Rigohl/nuclear-crawler-hybrid"
repository = "https://github.com/Rigohl/nuclear-crawler-hybrid"
readme = "README.md"
keywords = ["mcp", "search-engine", "web-scraper", "axum", "http-server"]
categories = ["web-programming", "network-programming", "command-line-utilities"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Metadata para el servidor HTTP
[package.metadata.mcp]
protocol-version = "2025-06-18"
server-mode = ["stdio", "http"]
default-port = 8080
tools = ["websearch", "file_search", "analyzer", "stats"]

# Metadata de módulos FFI
[package.metadata.ffi]
go-integration = true
zig-integration = true
nim-integration = true
max-goroutines = 100000
simd-enabled = true

# Metadata de aceleración
[package.metadata.acceleration]
jax-enabled = true
mojo-enabled = true
gpu-support = true

# Metadata de búsqueda
[package.metadata.search]
engines = ["duckduckgo", "bing", "brave", "searx"]
max-parallel-urls = 1000
max-queries = 5
deep-web-enabled = true
huggingface-enabled = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws", "json", "tokio", "macros"] }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
num_cpus = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
backtrace = "0.3"
log = "0.4"
reqwest = { version = "0.11", features = ["json", "cookies", "deflate", "brotli"] }
rusqlite = { version = "0.31", features = ["bundled", "array", "functions"] }
regex = "1.10"
hyper = "1.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "limit", "compression-br"] }
tempfile = "3"
html5ever = "0.26"
scraper = "0.20"
url = "2"
blake3 = "1"
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
itertools = "0.13"
bytes = "1"
csv = "1"
percent-encoding = "2"
backoff = "0.4"
ammonia = "4"
rand = "0.8"
wasm-bindgen = "0.2"
libloading = "0.8"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "Headers", "Request", "RequestInit", "RequestMode", "Response", "RequestCredentials"] }
urlencoding = "2"

# Modern Rust 2024 crates for performance and best practices
once_cell = "1.19"
parking_lot = "0.12"
smallvec = "1.13"
ahash = "0.8"
crossbeam = "0.8"
arc-swap = "1.7"
miniz_oxide = "0.7"

[lib]
name = "nuclear_crawler_hybrid"
path = "src/lib.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[[bin]]
name = "nuclear-mcp"
path = "src/bin/nuclear_ultimate.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.bench]
inherits = "release"
