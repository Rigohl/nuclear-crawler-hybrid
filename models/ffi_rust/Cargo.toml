[package]
name = "math_dataset_processor"
version = "0.1.0"
edition = "2021"

[lib]
name = "math_dataset_processor"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
ndarray = "0.15"
num-traits = "0.2"
rand = "0.8"


[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]