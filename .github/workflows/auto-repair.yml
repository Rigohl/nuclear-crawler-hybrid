name: 🤖 Nuclear Auto-Repair Agent

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      force_repair:
        description: 'Forzar reparación completa'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_branch:
        description: 'Rama objetivo para reparaciones'
        required: false
        default: 'main'
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  analyze-and-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🦀 Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: 📦 Cache Cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: 🔍 Initial Code Analysis
      id: initial_analysis
      run: |
        echo "🔍 Running initial code analysis..."

        # Cargo check con output detallado
        cargo check --message-format=json > cargo_check_initial.json 2>&1 || true

        # Contar errores y warnings
        ERRORS=$(grep -c '"level":"error"' cargo_check_initial.json || echo "0")
        WARNINGS=$(grep -c '"level":"warning"' cargo_check_initial.json || echo "0")

        echo "errors=$ERRORS" >> $GITHUB_OUTPUT
        echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

        echo "📊 Initial Analysis: $ERRORS errors, $WARNINGS warnings"

        # Guardar resultados para debugging
        echo "INITIAL_ERRORS=$ERRORS" >> $GITHUB_ENV
        echo "INITIAL_WARNINGS=$WARNINGS" >> $GITHUB_ENV

    - name: 🤖 Auto-Repair Agent - Clippy Fixes
      if: steps.initial_analysis.outputs.warnings != '0' || github.event.inputs.force_repair == 'true'
      run: |
        echo "🤖 Running Clippy auto-fixes..."

        # Intentar correcciones automáticas con clippy
        cargo clippy --fix --allow-dirty --allow-staged || true

        # Verificar si se hicieron cambios
        if git diff --quiet; then
          echo "No changes made by clippy"
          CLIPPY_CHANGES=false
        else
          echo "Clippy made changes"
          CLIPPY_CHANGES=true
          git add .
          git commit -m "🤖 Auto-repair: Clippy fixes applied

- Applied automatic clippy fixes
- Improved code quality and style
- Auto-generated by Nuclear Repair Agent" || true
        fi

        echo "CLIPPY_CHANGES=$CLIPPY_CHANGES" >> $GITHUB_ENV

    - name: 🛠️ Auto-Repair Agent - Rustfmt
      if: steps.initial_analysis.outputs.errors != '0' || steps.initial_analysis.outputs.warnings != '0' || github.event.inputs.force_repair == 'true'
      run: |
        echo "🛠️ Running rustfmt auto-formatting..."

        # Aplicar formato automático
        cargo fmt

        # Verificar cambios
        if git diff --quiet; then
          echo "No formatting changes needed"
          FMT_CHANGES=false
        else
          echo "Formatting changes applied"
          FMT_CHANGES=true
          git add .
          git commit -m "🤖 Auto-repair: Code formatting applied

- Applied rustfmt formatting
- Improved code consistency
- Auto-generated by Nuclear Repair Agent" || true
        fi

        echo "FMT_CHANGES=$FMT_CHANGES" >> $GITHUB_ENV

    - name: 🔧 Advanced Repair Agent - Common Fixes
      if: steps.initial_analysis.outputs.errors != '0' || github.event.inputs.force_repair == 'true'
      run: |
        echo "🔧 Running advanced repair agent..."

        # Reparaciones comunes automáticas
        python3 -c "
        import os
        import re
        import subprocess

        def apply_common_fixes():
            fixes_applied = []

            # Buscar archivos Rust
            for root, dirs, files in os.walk('src'):
                for file in files:
                    if file.endswith('.rs'):
                        filepath = os.path.join(root, file)
                        try:
                            with open(filepath, 'r', encoding='utf-8') as f:
                                content = f.read()

                            original_content = content

                            # Fix: unused imports
                            content = re.sub(r'use\s+\w+::\{\s*\};?\s*', '', content, flags=re.MULTILINE)

                            # Fix: missing derives
                            if '#[derive(' not in content and 'struct ' in content:
                                # Buscar structs sin derive
                                struct_matches = re.finditer(r'pub struct (\w+)', content)
                                for match in struct_matches:
                                    struct_name = match.group(1)
                                    if not re.search(rf'#\[derive\([^)]*\)\]\s*pub struct {struct_name}', content):
                                        content = re.sub(
                                            rf'(pub struct {struct_name})',
                                            '#[derive(Debug, Clone)]\n\\1',
                                            content
                                        )
                                        fixes_applied.append(f'Added derive to {struct_name}')

                            # Fix: unwrap() to expect()
                            content = re.sub(r'\.unwrap\(\)', '.expect(\"Auto-fixed by repair agent\")', content)

                            if content != original_content:
                                with open(filepath, 'w', encoding='utf-8') as f:
                                    f.write(content)
                                fixes_applied.append(f'Fixed {filepath}')

                        except Exception as e:
                            print(f'Error processing {filepath}: {e}')

            return fixes_applied

        fixes = apply_common_fixes()
        print(f'Applied {len(fixes)} fixes: {fixes}')

        # Guardar resultado
        with open('repair_agent_results.txt', 'w') as f:
            f.write(f'Fixes applied: {len(fixes)}\\n')
            for fix in fixes:
                f.write(f'- {fix}\\n')
        "

        # Verificar si se hicieron cambios
        if [ -f "repair_agent_results.txt" ]; then
          FIXES_COUNT=$(grep -c "Fixes applied:" repair_agent_results.txt || echo "0")
          if [ "$FIXES_COUNT" -gt 0 ] && ! git diff --quiet; then
            echo "Advanced fixes applied"
            git add .
            git commit -m "🤖 Auto-repair: Advanced fixes applied

- Applied common Rust fixes
- Improved error handling
- Auto-generated by Nuclear Repair Agent

$(cat repair_agent_results.txt)" || true
            ADVANCED_CHANGES=true
          else
            ADVANCED_CHANGES=false
          fi
        else
          ADVANCED_CHANGES=false
        fi

        echo "ADVANCED_CHANGES=$ADVANCED_CHANGES" >> $GITHUB_ENV

    - name: 🚀 Final Verification
      id: final_analysis
      run: |
        echo "🚀 Running final verification..."

        # Verificar compilación después de reparaciones
        cargo check --message-format=json > cargo_check_final.json 2>&1 || true

        # Contar errores y warnings finales
        FINAL_ERRORS=$(grep -c '"level":"error"' cargo_check_final.json || echo "0")
        FINAL_WARNINGS=$(grep -c '"level":"warning"' cargo_check_final.json || echo "0")

        echo "final_errors=$FINAL_ERRORS" >> $GITHUB_OUTPUT
        echo "final_warnings=$FINAL_WARNINGS" >> $GITHUB_OUTPUT

        echo "📊 Final Analysis: $FINAL_ERRORS errors, $FINAL_WARNINGS warnings"

        # Calcular mejoras
        IMPROVEMENT=$((INITIAL_ERRORS - FINAL_ERRORS))
        echo "IMPROVEMENT=$IMPROVEMENT" >> $GITHUB_ENV

    - name: 📤 Push Auto-Repairs
      if: (env.CLIPPY_CHANGES == 'true' || env.FMT_CHANGES == 'true' || env.ADVANCED_CHANGES == 'true') && github.event_name == 'push'
      run: |
        echo "📤 Pushing auto-repair commits..."

        # Push changes
        git push origin HEAD

        echo "✅ Auto-repair commits pushed successfully"

    - name: 🔄 Create Repair PR
      if: (env.CLIPPY_CHANGES == 'true' || env.FMT_CHANGES == 'true' || env.ADVANCED_CHANGES == 'true') && github.event_name == 'pull_request'
      run: |
        echo "🔄 Creating repair PR..."

        # Crear rama de reparación
        REPAIR_BRANCH="auto-repair-${{ github.run_id }}"
        git checkout -b $REPAIR_BRANCH

        # Push de la rama de reparación
        git push origin $REPAIR_BRANCH

        # Crear PR
        gh pr create \
          --title "🤖 Auto-Repair: Code Quality Improvements" \
          --body "This PR contains automatic code quality improvements applied by the Nuclear Repair Agent.

## Changes Applied:
$(if [ "$CLIPPY_CHANGES" = "true" ]; then echo "- ✅ Clippy fixes applied"; fi)
$(if [ "$FMT_CHANGES" = "true" ]; then echo "- ✅ Code formatting applied"; fi)
$(if [ "$ADVANCED_CHANGES" = "true" ]; then echo "- ✅ Advanced fixes applied"; fi)

## Impact:
- Errors: $INITIAL_ERRORS → $FINAL_ERRORS (${IMPROVEMENT} improvement)
- Warnings: $INITIAL_WARNINGS → $FINAL_WARNINGS

Auto-generated by Nuclear MCP Repair Agent" \
          --base ${{ github.event.pull_request.base.ref }} \
          --head $REPAIR_BRANCH \
          --label "automated,repair,quality"

    - name: 📋 Create Issue for Manual Review
      if: steps.final_analysis.outputs.final_errors != '0' && steps.final_analysis.outputs.final_errors == steps.initial_analysis.outputs.errors
      run: |
        echo "📋 Creating issue for manual review - no improvements made..."

        # Crear issue si no se pudieron reparar errores automáticamente
        gh issue create \
          --title "🚨 Manual Code Review Required - Auto-Repair Failed" \
          --body "## 🚨 Auto-Repair Agent Could Not Fix All Issues

The Nuclear Repair Agent attempted to fix code issues automatically but was unable to resolve all problems.

### Analysis Results:
- **Initial Errors:** $INITIAL_ERRORS
- **Final Errors:** ${{ steps.final_analysis.outputs.final_errors }}
- **Initial Warnings:** $INITIAL_WARNINGS
- **Final Warnings:** ${{ steps.final_analysis.outputs.final_warnings }}

### What Was Attempted:
- ✅ Clippy automatic fixes
- ✅ Code formatting (rustfmt)
- ✅ Common Rust pattern fixes
- ✅ Error handling improvements

### Required Action:
Manual review and fixes needed for remaining compilation errors.

### Files to Review:
$(grep '"spans"' cargo_check_final.json | head -10 | jq -r '.[].file_name' | sort | uniq | sed 's/^/- /')

**Priority:** High
**Assignee:** Code reviewers" \
          --label "manual-review,compilation-error,urgent"

    - name: 📊 Generate Repair Report
      if: always()
      run: |
        echo "📊 Generating repair report..."

        # Crear reporte detallado
        cat > repair_report.md << EOF
# 🤖 Nuclear Repair Agent Report

## Execution Summary
- **Workflow Run:** ${{ github.run_id }}
- **Triggered by:** ${{ github.event_name }}
- **Branch:** ${{ github.ref }}
- **Commit:** ${{ github.sha }}

## Code Quality Metrics

### Before Auto-Repair:
- Errors: $INITIAL_ERRORS
- Warnings: $INITIAL_WARNINGS

### After Auto-Repair:
- Errors: ${{ steps.final_analysis.outputs.final_errors }}
- Warnings: ${{ steps.final_analysis.outputs.final_warnings }}
- Improvement: $IMPROVEMENT errors fixed

## Applied Fixes:
$(if [ "$CLIPPY_CHANGES" = "true" ]; then echo "- ✅ Clippy automatic fixes"; fi)
$(if [ "$FMT_CHANGES" = "true" ]; then echo "- ✅ Code formatting"; fi)
$(if [ "$ADVANCED_CHANGES" = "true" ]; then echo "- ✅ Advanced pattern fixes"; fi)

## Files Modified:
$(git diff --name-only HEAD~1 2>/dev/null || echo "No commits made")

## Recommendations:
$(if [ "${{ steps.final_analysis.outputs.final_errors }}" -gt 0 ]; then
  echo "- Manual review required for remaining errors"
  echo "- Consider updating dependencies"
  echo "- Review complex error patterns"
else
  echo "- ✅ All automatic fixes applied successfully"
  echo "- Code quality improved"
fi)

---
*Auto-generated by Nuclear MCP Repair Agent*
EOF

        # Upload report as artifact
        echo "repair-report=repair_report.md" >> $GITHUB_OUTPUT

    - name: 📎 Upload Repair Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: nuclear-repair-report-${{ github.run_id }}
        path: repair_report.md

    - name: 🔔 Notification
      if: failure()
      run: |
        echo "🔔 Repair workflow failed - manual intervention may be required"

        # Aquí se podría agregar integración con Slack, Discord, etc.
        echo "Workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
