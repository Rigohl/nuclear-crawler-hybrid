name: 🔁 Enhanced Retry & Persistence for All Workflows

# This workflow ensures total automation with comprehensive retry and persistence
# Runs on ALL workflow failures to provide retry and recovery

on:
  workflow_run:
    workflows: ["*"]  # Monitor ALL workflows
    types:
      - completed
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes - aggressive persistence
  workflow_dispatch:
    inputs:
      force_retry_all:
        description: 'Force retry all failed operations'
        required: false
        default: 'false'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read
  pull-requests: write
  issues: write

jobs:
  # Monitor and retry failed workflows
  monitor-and-retry:
    name: 🔁 Monitor & Retry All Workflows
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: 📥 Restore Global Retry State
        uses: actions/cache/restore@v3
        with:
          path: |
            .retry_state.json
            .global_retry_state.json
          key: global-retry-state-${{ github.repository }}
          restore-keys: |
            global-retry-state-
      
      - name: 🔍 Analyze Failed Workflow
        if: github.event.workflow_run.conclusion == 'failure'
        id: analyze
        run: |
          echo "🔍 Analyzing failed workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          
          echo "workflow_name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "workflow_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
      
      - name: 🔁 Comprehensive Retry Sequence
        id: retry
        run: |
          echo "🔁 Starting comprehensive retry sequence..."
          
          # Track overall success
          overall_success=true
          
          # 1. Format with retry
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "1️⃣ FORMAT CHECK WITH RETRY"
          echo "═══════════════════════════════════════════════════════════"
          if python3 scripts/universal_retry_system.py --fmt --max-attempts 5; then
            echo "✅ Format check passed"
          else
            echo "⚠️ Format failed, auto-fixing..."
            cargo fmt || true
            overall_success=false
          fi
          
          # 2. Clippy with retry
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "2️⃣ CLIPPY CHECK WITH RETRY"
          echo "═══════════════════════════════════════════════════════════"
          if python3 scripts/universal_retry_system.py --clippy --max-attempts 5; then
            echo "✅ Clippy passed"
          else
            echo "⚠️ Clippy failed, auto-fixing..."
            cargo clippy --fix --allow-dirty --allow-staged || true
            overall_success=false
          fi
          
          # 3. Build with retry
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "3️⃣ BUILD WITH RETRY"
          echo "═══════════════════════════════════════════════════════════"
          if python3 scripts/universal_retry_system.py --build --max-attempts 5; then
            echo "✅ Build passed"
          else
            echo "⚠️ Build failed, attempting recovery..."
            cargo clean
            cargo update || true
            if python3 scripts/universal_retry_system.py --build --max-attempts 3; then
              echo "✅ Build recovered"
            else
              echo "❌ Build failed after all retries"
              overall_success=false
            fi
          fi
          
          # 4. Test with retry
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "4️⃣ TEST WITH RETRY"
          echo "═══════════════════════════════════════════════════════════"
          if python3 scripts/universal_retry_system.py --test --max-attempts 5; then
            echo "✅ Tests passed"
          else
            echo "⚠️ Tests failed, attempting recovery..."
            cargo clean
            cargo build --lib || true
            if python3 scripts/universal_retry_system.py --test --max-attempts 3; then
              echo "✅ Tests recovered"
            else
              echo "❌ Tests failed after all retries"
              overall_success=false
            fi
          fi
          
          # 5. Run advanced auto-repair
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "5️⃣ ADVANCED AUTO-REPAIR"
          echo "═══════════════════════════════════════════════════════════"
          python3 scripts/advanced_auto_repair_agent.py --auto-repair --max-iterations 3 || true
          
          # 6. Run enhanced validation
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "6️⃣ ENHANCED VALIDATION"
          echo "═══════════════════════════════════════════════════════════"
          python3 scripts/validate_system.py --enhanced || true
          
          # Set output
          if [ "$overall_success" = "true" ]; then
            echo "retry_success=true" >> $GITHUB_OUTPUT
            echo ""
            echo "✅ All retry operations succeeded!"
          else
            echo "retry_success=false" >> $GITHUB_OUTPUT
            echo ""
            echo "⚠️ Some operations still failing after retries"
          fi
        continue-on-error: true
      
      - name: 💾 Save Global Retry State
        if: always()
        uses: actions/cache/save@v3
        with:
          path: |
            .retry_state.json
            .global_retry_state.json
          key: global-retry-state-${{ github.repository }}-${{ github.run_id }}
      
      - name: 📤 Commit Auto-Fixes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git add -A
            git commit -m "fix: auto-fixes from comprehensive retry system

Applied automatic fixes:
- Format corrections
- Clippy suggestions
- Build recovery
- Test improvements

[skip ci]" || true
            
            git push || echo "⚠️ Push failed (may be up to date)"
          fi
      
      - name: 📊 Generate Comprehensive Summary
        if: always()
        run: |
          echo "## 🔁 Comprehensive Retry & Persistence Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.workflow_run.name }}" != "" ]; then
            echo "**Failed Workflow:** ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Run ID:** ${{ github.event.workflow_run.id }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Operations Performed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Format check with retry (5 attempts)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Clippy check with retry (5 attempts)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Build with retry (5+3 attempts)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Test with retry (5+3 attempts)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Advanced auto-repair (3 iterations)" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Enhanced validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Retry State" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/universal_retry_system.py --summary 2>/dev/null || echo "No retry state available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.retry.outputs.retry_success }}" = "true" ]; then
            echo "### ✅ Result: All Operations Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Result: Some Operations Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Manual intervention may be required." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by Universal Retry System with State Persistence*" >> $GITHUB_STEP_SUMMARY
      
      - name: 🚨 Create Issue for Persistent Failures
        if: steps.retry.outputs.retry_success != 'true' && github.event.workflow_run.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = '${{ github.event.workflow_run.name }}';
            const runId = '${{ github.event.workflow_run.id }}';
            
            // Check for existing issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'persistent-failure,auto-created'
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes(workflowName) && issue.title.includes('Persistent Failure')
            );
            
            const issueBody = `## 🚨 Persistent Workflow Failure

**Workflow:** ${workflowName}  
**Run ID:** ${runId}  
**Time:** ${new Date().toISOString()}

### 🔁 Retry Attempts

The comprehensive retry system has attempted to recover this workflow but persistent failures remain.

**Retry Sequence Applied:**
1. ✅ Format check with retry (up to 5 attempts)
2. ✅ Clippy check with retry (up to 5 attempts)
3. ✅ Build with retry (up to 8 attempts)
4. ✅ Test with retry (up to 8 attempts)
5. ✅ Advanced auto-repair (3 iterations)
6. ✅ Enhanced validation

### 📊 State Persistence

All retry state has been persisted and will be available for future runs.

### 🔧 Recommended Actions

1. Review the [workflow run logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})
2. Check the retry state summary above
3. Manual fixes may be required for persistent issues
4. Consider adjusting retry parameters if needed

### 🤖 Automation Status

- ✅ Automatic retries: Active
- ✅ State persistence: Enabled
- ✅ Auto-fixes: Applied
- ✅ Recovery attempts: Exhausted

---
*This issue was automatically created by the Enhanced Retry & Persistence system*`;
            
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 Failure Recurred\n\n${issueBody}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Persistent Failure: ${workflowName}`,
                body: issueBody,
                labels: ['persistent-failure', 'auto-created', 'needs-investigation', 'high-priority']
              });
              console.log('Created new persistent failure issue');
            }

  # Cleanup old retry state
  cleanup-state:
    name: 🧹 Cleanup Old Retry State
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📥 Restore Global Retry State
        uses: actions/cache/restore@v3
        with:
          path: |
            .retry_state.json
            .global_retry_state.json
          key: global-retry-state-${{ github.repository }}
      
      - name: 🧹 Cleanup Old Operations
        run: |
          echo "🧹 Cleaning up retry state older than 7 days..."
          python3 scripts/universal_retry_system.py --cleanup 7
      
      - name: 💾 Save Cleaned State
        uses: actions/cache/save@v3
        with:
          path: |
            .retry_state.json
            .global_retry_state.json
          key: global-retry-state-${{ github.repository }}-cleaned-${{ github.run_id }}
