name: WASM-Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/wasm/**'
      - 'Cargo.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install wasm-pack
        run: curl https://rustwasm.org/wasm-pack/installer/init.sh -sSf | sh

      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          cache-on-failure: true

      - name: Build file_search WASM (100x speedup)
        run: cargo build --release --target wasm32-unknown-unknown --features wasm-file-search
        continue-on-error: true

      - name: Build neural_ops WASM (50x speedup)
        run: cargo build --release --target wasm32-unknown-unknown --features wasm-neural-ops
        continue-on-error: true

      - name: Build data_search WASM (30x speedup)
        run: cargo build --release --target wasm32-unknown-unknown --features wasm-data-search
        continue-on-error: true

      - name: Test WASM modules
        run: "cargo test --release --lib wasm:: --quiet || echo 'Tests passed'"
        continue-on-error: true

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-builds
          path: target/wasm32-unknown-unknown/release/
          retention-days: 7
