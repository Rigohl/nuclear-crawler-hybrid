name: 🚀 CI - Nuclear Crawler Hybrid (Optimized)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Critical validation - uses reusable workflow
  validate-constraints:
    name: ⚠️ Validate Critical Constraints
    uses: ./.github/workflows/reusable-mcp-validation.yml
    with:
      validate-7-tools: true
      check-mocks: true
      run-integration-tests: false

  # Rust build & test - consolidated for all platforms
  rust-ci:
    name: 🦀 Rust CI - ${{ matrix.os }}
    needs: validate-constraints
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 📝 Format Check
        run: cargo fmt -- --check

      - name: 🔍 Clippy
        run: cargo clippy -- -D warnings

      - name: 🔨 Build
        run: cargo build --release --verbose

      - name: 🧪 Run Tests
        run: cargo test --verbose

      - name: 🧪 Integration Tests
        run: cargo test --test integration_real_mcp --release -- --nocapture
        continue-on-error: true

      - name: 📦 Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v3
        with:
          name: nuclear-mcp-linux
          path: target/release/nuclear-mcp

  # Chapel CI (Linux only)
  chapel-ci:
    name: 🧠 Chapel AI CI
    needs: validate-constraints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Chapel
        run: |
          wget -q https://github.com/chapel-lang/chapel/releases/download/1.32.0/chapel-1.32.0.tar.gz
          tar xzf chapel-1.32.0.tar.gz
          cd chapel-1.32.0
          ./configure --prefix=/opt/chapel
          make -j$(nproc)
          sudo make install
          echo "/opt/chapel/bin" >> $GITHUB_PATH

      - name: Set CHAPEL_HOME
        run: echo "CHAPEL_HOME=/opt/chapel" >> $GITHUB_ENV

      - name: 🔍 Chapel Syntax Check
        working-directory: ffi/chapel
        run: make check

      - name: 🔨 Build Chapel Systems
        working-directory: ffi/chapel
        run: make full-pipeline

      - name: 🧪 Chapel Tests
        working-directory: ffi/chapel
        run: make test
        continue-on-error: true

  # Go CI
  go-ci:
    name: 🐹 Go GitHub MCP CI
    needs: validate-constraints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: 📥 Go Mod Download
        working-directory: mcp-servers/github
        run: go mod download

      - name: 🔨 Build
        working-directory: mcp-servers/github
        run: go build -v ./...

      - name: 🧪 Go Tests
        working-directory: mcp-servers/github
        run: go test -v ./...

      - name: 🔍 Go Vet
        working-directory: mcp-servers/github
        run: go vet ./...

      - name: 📝 Go Fmt Check
        working-directory: mcp-servers/github
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Go code not formatted. Run: go fmt ./..."
            exit 1
          fi

  # Security audit
  security-audit:
    name: 🔐 Security Audit
    needs: validate-constraints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🔍 Cargo Audit
        run: |
          cargo install cargo-audit
          cargo audit
        continue-on-error: true

      - name: 🔍 Dependency Check
        run: cargo tree --duplicates

  # Final report
  ci-report:
    name: 📊 CI Report
    needs: [validate-constraints, rust-ci, chapel-ci, go-ci, security-audit]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 CI Summary - Nuclear Crawler Hybrid" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Critical Constraints" >> $GITHUB_STEP_SUMMARY
          echo "- 7 MCP Tools: Verified" >> $GITHUB_STEP_SUMMARY
          echo "- NO MOCKS Policy: Enforced" >> $GITHUB_STEP_SUMMARY
          echo "- Chapel Core: Protected" >> $GITHUB_STEP_SUMMARY
          echo "- 3 Binaries: nuclear-mcp(7), nuclear-pro(5), nuclear-lite(2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔨 Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Rust MCP: ${{ needs.rust-ci.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Chapel AI: ${{ needs.chapel-ci.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Go GitHub MCP: ${{ needs.go-ci.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔐 Security" >> $GITHUB_STEP_SUMMARY
          echo "- Audit: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
