name: 🔁 Universal Retry & Persistence Layer

# This workflow adds a retry and persistence layer to ALL other workflows
# Ensures total automation with comprehensive error recovery

on:
  workflow_call:
    inputs:
      command:
        description: 'Command to execute with retry'
        required: true
        type: string
      max_attempts:
        description: 'Maximum retry attempts'
        required: false
        type: number
        default: 10
      operation_name:
        description: 'Operation name for tracking'
        required: false
        type: string
    outputs:
      success:
        description: 'Whether the operation succeeded'
        value: ${{ jobs.retry-execute.outputs.success }}
      attempts:
        description: 'Number of attempts needed'
        value: ${{ jobs.retry-execute.outputs.attempts }}

permissions:
  contents: write
  actions: read

jobs:
  retry-execute:
    name: 🔁 Execute with Retry
    runs-on: ubuntu-latest

    outputs:
      success: ${{ steps.execute.outputs.success }}
      attempts: ${{ steps.execute.outputs.attempts }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Rust (if needed)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📥 Restore Retry State
        id: restore-state
        uses: actions/cache/restore@v3
        with:
          path: .retry_state.json
          key: retry-state-${{ github.repository }}-${{ github.workflow }}
          restore-keys: |
            retry-state-${{ github.repository }}-

      - name: 🔁 Execute with Universal Retry
        id: execute
        run: |
          echo "🔁 Executing with universal retry system..."
          echo "Command: ${{ inputs.command }}"
          echo "Max attempts: ${{ inputs.max_attempts }}"

          # Execute command with retry
          if python3 scripts/universal_retry_system.py \
            --command ${{ inputs.command }} \
            --max-attempts ${{ inputs.max_attempts }} \
            --operation "${{ inputs.operation_name || inputs.command }}"; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ Operation succeeded"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Operation failed after retries"
          fi

          # Get attempt count
          attempts=$(python3 -c "
          import json
          try:
              with open('.retry_state.json') as f:
                  state = json.load(f)
                  # Get the most recent operation
                  ops = state.get('operations', {})
                  if ops:
                      latest = max(ops.items(), key=lambda x: x[1].get('last_attempt', ''))
                      print(latest[1].get('attempts', 0))
                  else:
                      print(0)
          except:
              print(0)
          ")

          echo "attempts=$attempts" >> $GITHUB_OUTPUT
          echo "Attempts needed: $attempts"

      - name: 💾 Save Retry State
        if: always()
        uses: actions/cache/save@v3
        with:
          path: .retry_state.json
          key: retry-state-${{ github.repository }}-${{ github.workflow }}-${{ github.run_id }}

      - name: 📊 Show Retry Summary
        if: always()
        run: |
          python3 scripts/universal_retry_system.py --summary || true

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🔁 Retry Execution Summary

          **Command:** `${{ inputs.command }}`
          **Operation:** ${{ inputs.operation_name || inputs.command }}
          **Max Attempts:** ${{ inputs.max_attempts }}
          **Result:** ${{ steps.execute.outputs.success == 'true' && '✅ Success' || '❌ Failed' }}
          **Attempts Used:** ${{ steps.execute.outputs.attempts }}

          ---

          *Powered by Universal Retry System with State Persistence*
          EOF
