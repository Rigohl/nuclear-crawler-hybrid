name: Chapel AI Learning Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chapel-build:
    name: Build Chapel AI Full Pipeline (Chapel 2.8 — MANDATORY)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: chapel/chapel:2.8.0
    steps:
      - uses: actions/checkout@v4

      - name: Verify Chapel 2.8
        run: |
          chpl --version
          VER=$(chpl --version 2>&1 | grep -oP '\d+\.\d+' | head -1)
          echo "Chapel version: $VER"
          # Must be >= 2.8
          MAJOR=$(echo $VER | cut -d. -f1)
          MINOR=$(echo $VER | cut -d. -f2)
          if [ "$MAJOR" -lt 2 ] || ([ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 8 ]); then
            echo "❌ Chapel version $VER is below required 2.8"
            exit 1
          fi
          echo "✅ Chapel $VER meets requirement (>= 2.8)"

      - name: Build libchapel_ai.so (FFI library)
        working-directory: ffi/chapel
        run: |
          chpl --library --dynamic --fast -O3 \
            -o libchapel_ai.so ai/nuclear_chapel_ai.chpl
          ls -lh libchapel_ai.so
          echo "✅ libchapel_ai.so built"

      - name: Build Unified Nuclear AI
        working-directory: ffi/chapel
        run: |
          mkdir -p bin
          chpl --fast -O3 -o bin/unified_nuclear_ai ai/unified_nuclear_ai.chpl
          echo "✅ unified_nuclear_ai built"

      - name: Build Training Pipeline
        working-directory: ffi/chapel
        run: |
          chpl --fast -O3 -o bin/training_pipeline training_pipeline.chpl
          echo "✅ training_pipeline built"

      - name: Build Scientific Analysis
        working-directory: ffi/chapel
        run: |
          chpl --fast -O3 -o bin/scientific_analysis scientific_analysis.chpl
          echo "✅ scientific_analysis built"

      - name: Build Code Analyzer
        working-directory: ffi/chapel
        run: |
          chpl --fast -O3 -o bin/code_analyzer tools/code_analyzer.chpl
          echo "✅ code_analyzer built"

      - name: Build Code Repair
        working-directory: ffi/chapel
        run: |
          chpl --fast -O3 -o bin/code_repair tools/code_repair.chpl
          echo "✅ code_repair built"

      - name: Build Code Reviewer
        working-directory: ffi/chapel
        run: |
          chpl --fast -O3 -o bin/code_reviewer tools/code_reviewer.chpl
          echo "✅ code_reviewer built"

      - name: Verify all Chapel binaries
        working-directory: ffi/chapel
        run: |
          echo "=== Chapel AI Artifacts ==="
          ls -lh libchapel_ai.so bin/
          echo "✅ Chapel AI Learning Hub — all systems built"

      - name: Chapel syntax check (MCP integration files)
        working-directory: ffi/chapel
        run: |
          for f in mcp_integration/*.chpl; do
            echo "Checking syntax: $f"
            chpl --syntax-only "$f" 2>&1 || echo "  ⚠️  Syntax issue in $f (check extern proc declarations)"
          done
