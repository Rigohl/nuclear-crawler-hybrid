[networking]
# Connection pooling and HTTP optimization
connection_pool_size = 100
keep_alive_secs = 60
dns_cache_ttl_secs = 3600
request_timeout_secs = 30
retry_backoff_base_ms = 100
retry_max_attempts = 3

[memory]
