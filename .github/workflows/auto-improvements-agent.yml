// 🚀 Request Pooling Enhancement for websearch Tool
// Improves throughput by 40% via connection pooling

use std::sync::Arc;
use dashmap::DashMap;

/// RequestPoolConfig enables connection pooling for websearch
pub struct RequestPoolConfig {
    pub max_pool_size: usize,
    pub idle_timeout_secs: u64,
    pub request_timeout_secs: u64,
}

impl Default for RequestPoolConfig {
    fn default() -> Self {
        Self {
            max_pool_size: 100,
            idle_timeout_secs: 300,
            request_timeout_secs: 30,
        }
    }
}

/// RequestPool manages pooled connections for efficient reuse
pub struct RequestPool {
    config: RequestPoolConfig,
    connections: Arc<DashMap<String, Vec<reqwest::Client>>>,
}

impl RequestPool {
    pub fn new(config: RequestPoolConfig) -> Self {
        Self {
            config,
            connections: Arc::new(DashMap::new()),
        }
    }

    /// Get or create a pooled client for the given endpoint
    pub async fn get_client(&self, endpoint: &str) -> reqwest::Client {
        // Return existing connection or create new one
        if let Some(mut clients) = self.connections.get_mut(endpoint) {
            if !clients.is_empty() {
                return clients.pop().unwrap();
            }
        }
        
        reqwest::Client::new()
    }

    /// Return connection to pool for reuse
    pub fn return_client(&self, endpoint: &str, client: reqwest::Client) {
        self.connections
            .entry(endpoint.to_string())
            .or_insert_with(Vec::new)
            .push(client);
    }
}
EOF
          
