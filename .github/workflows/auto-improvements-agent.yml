// 💾 Caching Layer Enhancement for premium Tool
// Improves throughput by 60% via smart caching

use lru::LruCache;
use std::sync::{Arc, Mutex};
use std::num::NonZeroUsize;

/// CacheEntry holds extracted content with metadata
#[derive(Clone, Debug)]
pub struct CacheEntry {
    pub content: String,
    pub url: String,
    pub timestamp: u64,
    pub ttl_secs: u64,
}

/// PremiumCache provides multi-level caching for premium content
pub struct PremiumCache {
    /// L1: In-memory LRU cache (10K entries)
    memory_cache: Arc<Mutex<LruCache<String, CacheEntry>>>,
    /// L2: Disk-based storage (via RocksDB)
    disk_cache: Option<Arc<Mutex<sqlite::Connection>>>,
}

impl PremiumCache {
    pub fn new(capacity: usize) -> Self {
        Self {
            memory_cache: Arc::new(Mutex::new(
                LruCache::new(NonZeroUsize::new(capacity).unwrap())
            )),
            disk_cache: None,
        }
    }

    /// Get cached entry if available and not expired
    pub fn get(&self, key: &str) -> Option<CacheEntry> {
        let mut cache = self.memory_cache.lock().unwrap();
        if let Some(entry) = cache.get(key) {
            let age = std::time::SystemTime::now()
                .duration_since(std::time::UNIX_EPOCH)
                .unwrap()
                .as_secs() - entry.timestamp;
            
            if age < entry.ttl_secs {
                return Some(entry.clone());
            }
        }
        None
    }

    /// Store entry in cache with TTL
    pub fn set(&self, key: String, entry: CacheEntry) {
        let mut cache = self.memory_cache.lock().unwrap();
        cache.put(key, entry);
    }
}
EOF
          
