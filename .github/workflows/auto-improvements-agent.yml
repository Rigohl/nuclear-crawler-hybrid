[async_runtime]
# Tokio configuration for optimal performance
worker_threads = 0  # Auto-detect CPU cores
max_io_events_per_tick = 1024
event_interval = 61  # First liveliness check delay

[caching]
# Multi-level caching strategy
l1_memory_capacity = 10000  # Items
l1_memory_ttl_secs = 300
l2_disk_capacity_mb = 1000
l2_disk_ttl_secs = 86400
