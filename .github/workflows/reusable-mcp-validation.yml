name: Reusable MCP Validation

on:
  workflow_call:
    inputs:
      validate-5-tools:
        description: 'Validate exactly 5 MCP tools'
        required: false
        type: boolean
        default: true
      check-mocks:
        description: 'Check for mock code'
        required: false
        type: boolean
        default: true
      run-integration-tests:
        description: 'Run MCP integration tests'
        required: false
        type: boolean
        default: false

jobs:
  mcp-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 🔍 Validate exactly 5 MCP tools
        if: inputs.validate-5-tools
        run: cargo test test_exactly_5_tools --lib

      - name: 🚫 Check for Mock Code
        if: inputs.check-mocks
        run: |
          if grep -r "mock_\|Mock\|TODO: implement\|unimplemented!" src/ 2>/dev/null; then
            echo "❌ VIOLATION: Mock code detected (NO MOCKS policy)"
            exit 1
          else
            echo "✅ No mock code detected"
          fi

      - name: 🧪 Run MCP Integration Tests
        if: inputs.run-integration-tests
        continue-on-error: true
        run: cargo test --test integration_real_mcp --release -- --nocapture --test-threads=1
