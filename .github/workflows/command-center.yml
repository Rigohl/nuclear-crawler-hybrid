name: 🎯 Nuclear MCP Command Center

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando a ejecutar'
        required: true
        default: 'status'
        type: choice
        options:
          - 'status'
          - 'full-scan'
          - 'emergency-repair'
          - 'security-audit'
          - 'performance-test'
          - 'cleanup'
          - 'deploy'
      target:
        description: 'Objetivo del comando'
        required: false
        default: 'all'
        type: string
      force:
        description: 'Forzar ejecución'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  command-dispatcher:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      deployments: write

    outputs:
      command: ${{ steps.parse.outputs.command }}
      target: ${{ steps.parse.outputs.target }}
      force: ${{ steps.parse.outputs.force }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🎯 Parse Command
      id: parse
      run: |
        COMMAND="${{ github.event.inputs.command }}"
        TARGET="${{ github.event.inputs.target }}"
        FORCE="${{ github.event.inputs.force }}"

        echo "command=$COMMAND" >> $GITHUB_OUTPUT
        echo "target=$TARGET" >> $GITHUB_OUTPUT
        echo "force=$FORCE" >> $GITHUB_OUTPUT

        echo "🎯 Executing command: $COMMAND on target: $TARGET (force: $FORCE)"

  status-report:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'status'
    runs-on: ubuntu-latest

    steps:
    - name: 📊 Generate Status Report
      run: |
        echo "📊 Generating comprehensive status report..."

        # Información del repositorio
        REPO_INFO=$(gh repo view --json name,description,updatedAt,pushedAt,issues,pullRequests)

        # Estado de workflows recientes
        WORKFLOW_STATUS=$(gh run list --limit 10 --json status,conclusion,createdAt,headSha,workflowName)

        # Issues abiertas por tipo
        ISSUES_BY_LABEL=$(gh issue list --state open --limit 100 --json labels | jq -r '.[] | .labels[]?.name' | sort | uniq -c | sort -nr)

        # PRs abiertas
        OPEN_PRS=$(gh pr list --state open --limit 20 --json number,title,updatedAt,author)

        # Estadísticas de contribución
        CONTRIBUTORS=$(gh api repos/${{ github.repository }}/contributors --jq 'length')

        # Crear reporte de estado
        cat > status_report.md << EOF
        # 🎯 Nuclear MCP Command Center - Status Report

        ## 📊 Repository Overview
        **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Repository:** ${{ github.repository }}
        **Branch:** ${{ github.ref }}

        ### Repository Stats:
        - **Contributors:** $CONTRIBUTORS
        - **Last Push:** $(echo "$REPO_INFO" | jq -r '.pushedAt')
        - **Last Update:** $(echo "$REPO_INFO" | jq -r '.updatedAt')

        ## 🔄 Recent Workflow Status:
        $(echo "$WORKFLOW_STATUS" | jq -r '.[] | "- **\(.workflowName)**: \(.status)/\(.conclusion) (\(.createdAt))"')

        ## 📋 Issues Summary:
        ### Open Issues by Label:
        $(echo "$ISSUES_BY_LABEL" | awk '{print "- **"$2"**: "$1" issues"}')

        ### Recent Open Issues:
        $(gh issue list --state open --limit 5 --json number,title,labels | jq -r '.[] | "- #\(.number): \(.title) [\(.labels[]?.name // "no-label")]"' 2>/dev/null || echo "No issues found")

        ## 🔄 Pull Requests:
        $(echo "$OPEN_PRS" | jq -r '.[] | "- #\(.number): \(.title) by @\(.author.login) (\(.updatedAt))"' 2>/dev/null || echo "No open PRs")

        ## 🎯 Active MCP Tools:
        - ✅ File Search Processor
        - ✅ Web Search Processor
        - ✅ Premium Content Scraper
        - ✅ Auto-Repair Agent
        - ✅ Quality Guardian

        ## 🚨 System Health:
        $(if gh run list --status failure --limit 1 | grep -q "failure"; then echo "⚠️ **Recent workflow failures detected**"; else echo "✅ **All systems operational**"; fi)

        ---
        *Auto-generated by Nuclear MCP Command Center*
        EOF

        echo "STATUS_REPORT=status_report.md" >> $GITHUB_ENV

    - name: 📤 Upload Status Report
      uses: actions/upload-artifact@v3
      with:
        name: nuclear-status-report-${{ github.run_id }}
        path: status_report.md

    - name: 💬 Comment Status on Issues
      if: github.event.inputs.target != 'silent'
      run: |
        # Comentar estado en issues críticas
        CRITICAL_ISSUES=$(gh issue list --state open --label "urgent,critical" --json number | jq -r '.[].number')

        for issue in $CRITICAL_ISSUES; do
          gh issue comment $issue --body "🤖 **System Status Update**

        Current repository status has been generated. See the latest status report for details.

        [View Status Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

        ---
        *Auto-generated by Nuclear MCP Command Center*"
        done

  full-system-scan:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'full-scan'
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Trigger Full System Scan
      run: |
        echo "🚀 Initiating full system scan..."

        # Disparar workflow de calidad guardian con escaneo profundo
        gh workflow run quality-guardian.yml \
          -f deep_scan=true \
          -f target_branches="main,develop"

        # Disparar workflow de auto-repair
        gh workflow run auto-repair.yml

        # Disparar análisis de seguridad
        gh workflow run security.yml

        echo "✅ Full system scan initiated"

    - name: ⏳ Monitor Scan Progress
      run: |
        echo "⏳ Monitoring scan progress..."

        # Esperar a que los workflows se completen
        for i in {1..30}; do
          # Contar workflows en progreso
          RUNNING=$(gh run list --status in_progress --limit 10 --json workflowName | jq -r '.[] | select(.workflowName | test("quality-guardian|auto-repair|security")) | .workflowName' | wc -l)

          if [ "$RUNNING" -eq 0 ]; then
            echo "✅ All scans completed"
            break
          fi

          echo "🔄 $RUNNING scans still running... ($i/30)"
          sleep 60
        done

        if [ "$RUNNING" -gt 0 ]; then
          echo "⚠️ Some scans still running after timeout"
        fi

  emergency-repair:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'emergency-repair'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: 🚨 Emergency Repair Protocol
      run: |
        echo "🚨 ACTIVATING EMERGENCY REPAIR PROTOCOL..."

        # Verificar errores críticos
        CRITICAL_ERRORS=$(gh issue list --state open --label "compilation,urgent" --json number | jq -r '.[]?.number' | wc -l)

        if [ "$CRITICAL_ERRORS" -gt 0 ]; then
          echo "🚨 Critical errors detected: $CRITICAL_ERRORS"

          # Crear rama de emergencia
          EMERGENCY_BRANCH="emergency-repair-$(date +%Y%m%d-%H%M%S)"

          # Disparar reparación forzada
          gh workflow run auto-repair.yml \
            -f force_repair=true \
            -f target_branch=main

          echo "✅ Emergency repair initiated"
        else
          echo "ℹ️ No critical errors detected - emergency repair not needed"
        fi

  security-audit:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'security-audit'
    runs-on: ubuntu-latest

    steps:
    - name: 🔒 Comprehensive Security Audit
      run: |
        echo "🔒 Initiating comprehensive security audit..."

        # Ejecutar análisis de seguridad
        gh workflow run security.yml

        # Verificar dependencias vulnerables
        echo "🔍 Checking for vulnerable dependencies..."

        # Aquí se podría integrar con herramientas como:
        # - cargo-audit
        # - safety (para Python si existe)
        # - snyk
        # - dependabot alerts

        # Verificar secrets expuestos
        echo "🔐 Checking for exposed secrets..."

        # Buscar patrones de secrets en commits recientes
        SECRET_PATTERNS=(
          "password|passwd|pwd"
          "secret|token|key"
          "api_key|apikey"
          "aws_access_key|aws_secret"
        )

        for pattern in "${SECRET_PATTERNS[@]}"; do
          MATCHES=$(git log --oneline -n 20 | grep -i "$pattern" | wc -l)
          if [ "$MATCHES" -gt 0 ]; then
            echo "⚠️ Potential secret exposure detected: $pattern ($MATCHES matches)"
          fi
        done

        echo "✅ Security audit completed"

  performance-test:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'performance-test'
    runs-on: ubuntu-latest

    steps:
    - name: 📈 Performance Testing Suite
      run: |
        echo "📈 Running comprehensive performance tests..."

        # Ejecutar benchmarks si existen
        if [ -f "scripts/jax_processor.py" ]; then
          echo "🧠 Running JAX performance tests..."
          python3 scripts/jax_processor.py --benchmark || true
        fi

        # Ejecutar tests de carga
        echo "⚡ Running load tests..."

        # Aquí se pueden agregar tests de carga específicos
        # - Tests de compilación paralela
        # - Tests de búsqueda masiva
        # - Tests de memoria
        # - Tests de CPU

        echo "✅ Performance testing completed"

  repository-cleanup:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: 🧹 Nuclear Repository Cleanup
      run: |
        echo "🧹 Initiating nuclear repository cleanup..."

        # Ejecutar workflow de calidad guardian (que incluye cleanup)
        gh workflow run quality-guardian.yml

        # Limpiar issues cerradas antiguas (más de 30 días)
        echo "🗂️ Cleaning old closed issues..."
        CLOSED_ISSUES=$(gh issue list --state closed --limit 100 --json number,closedAt | jq -r '.[] | select(.closedAt < "'$(date -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)'") | .number')

        for issue in $CLOSED_ISSUES; do
          echo "Deleting old issue #$issue"
          gh issue delete $issue --yes || true
        done

        # Limpiar ramas inactivas
        echo "🌿 Cleaning inactive branches..."
        git branch -r | grep -v "main\|develop\|master" | while read -r branch; do
          LAST_COMMIT=$(git log -1 --since="30 days ago" "$branch" 2>/dev/null | wc -l)
          if [ "$LAST_COMMIT" -eq 0 ]; then
            BRANCH_NAME=$(echo "$branch" | sed 's|origin/||')
            echo "Deleting inactive branch: $BRANCH_NAME"
            git push origin --delete "$BRANCH_NAME" || true
          fi
        done

        echo "✅ Nuclear cleanup completed"

  deploy-coordinator:
    needs: command-dispatcher
    if: needs.command-dispatcher.outputs.command == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
    - name: 🚀 Deployment Coordinator
      run: |
        echo "🚀 Initiating deployment coordination..."

        # Verificar condiciones de deployment
        DEPLOY_READY=true

        # Verificar que no hay errores de compilación
        if gh run list --workflow ci.yml --status failure --limit 1 | grep -q "failure"; then
          echo "❌ Deployment blocked: Recent CI failures"
          DEPLOY_READY=false
        fi

        # Verificar que no hay issues críticos abiertos
        CRITICAL_ISSUES=$(gh issue list --state open --label "critical,blocker" --json number | jq -r '.[]?.number' | wc -l)
        if [ "$CRITICAL_ISSUES" -gt 0 ]; then
          echo "❌ Deployment blocked: $CRITICAL_ISSUES critical issues open"
          DEPLOY_READY=false
        fi

        # Verificar calidad de código
        if [ -f "quality_assessment.txt" ]; then
          QUALITY_SCORE=$(grep 'Quality Score:' quality_assessment.txt | cut -d' ' -f3 | cut -d'/' -f1)
          if [ "$QUALITY_SCORE" -lt 70 ]; then
            echo "❌ Deployment blocked: Quality score too low ($QUALITY_SCORE/100)"
            DEPLOY_READY=false
          fi
        fi

        if [ "$DEPLOY_READY" = true ]; then
          echo "✅ Deployment conditions met - proceeding..."

          # Crear deployment
          gh deployment create \
            --ref ${{ github.ref }} \
            --environment production \
            --description "Nuclear MCP deployment via Command Center"

          # Aquí se pueden agregar pasos de deployment específicos
          # - Build and push Docker images
          # - Deploy to cloud platforms
          # - Update CDN
          # - Run smoke tests

          echo "🚀 Deployment initiated successfully"
        else
          echo "⏸️ Deployment blocked - fix issues first"

          # Crear issue para seguimiento
          gh issue create \
            --title "🚫 Deployment Blocked - Issues Require Attention" \
            --body "## 🚫 Deployment Blocked

        The Nuclear Command Center has blocked deployment due to the following issues:

        ### Blocking Conditions:
        $(if gh run list --workflow ci.yml --status failure --limit 1 | grep -q "failure"; then echo "- ❌ Recent CI failures detected"; fi)
        $(if [ "$CRITICAL_ISSUES" -gt 0 ]; then echo "- ❌ $CRITICAL_ISSUES critical issues still open"; fi)
        $(if [ "$QUALITY_SCORE" -lt 70 ]; then echo "- ❌ Code quality too low ($QUALITY_SCORE/100)"; fi)

        ### Required Actions:
        1. Fix all compilation errors
        2. Resolve critical/blocker issues
        3. Improve code quality score above 70
        4. Re-run CI pipeline successfully

        Once all issues are resolved, re-run the deployment command.

        **Priority:** Critical
        **Labels:** deployment,blocked" \
            --label "deployment,blocked,critical"
        fi

  final-report:
    needs: [command-dispatcher, status-report, full-system-scan, emergency-repair, security-audit, performance-test, repository-cleanup, deploy-coordinator]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: 📋 Generate Final Command Report
      run: |
        echo "📋 Generating final command execution report..."

        COMMAND="${{ needs.command-dispatcher.outputs.command }}"
        SUCCESS=true

        # Verificar si todos los jobs tuvieron éxito
        if [ "${{ needs.status-report.result }}" = "failure" ] && [ "$COMMAND" = "status" ]; then SUCCESS=false; fi
        if [ "${{ needs.full-system-scan.result }}" = "failure" ] && [ "$COMMAND" = "full-scan" ]; then SUCCESS=false; fi
        if [ "${{ needs.emergency-repair.result }}" = "failure" ] && [ "$COMMAND" = "emergency-repair" ]; then SUCCESS=false; fi
        if [ "${{ needs.security-audit.result }}" = "failure" ] && [ "$COMMAND" = "security-audit" ]; then SUCCESS=false; fi
        if [ "${{ needs.performance-test.result }}" = "failure" ] && [ "$COMMAND" = "performance-test" ]; then SUCCESS=false; fi
        if [ "${{ needs.repository-cleanup.result }}" = "failure" ] && [ "$COMMAND" = "cleanup" ]; then SUCCESS=false; fi
        if [ "${{ needs.deploy-coordinator.result }}" = "failure" ] && [ "$COMMAND" = "deploy" ]; then SUCCESS=false; fi

        # Crear reporte final
        cat > command_center_report.md << EOF
        # 🎯 Nuclear MCP Command Center - Execution Report

        ## 📊 Command Execution Summary
        **Command:** $COMMAND
        **Target:** ${{ needs.command-dispatcher.outputs.target }}
        **Force Mode:** ${{ needs.command-dispatcher.outputs.force }}
        **Executed:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Run ID:** ${{ github.run_id }}

        ## ✅ Execution Results:

        ### Status Report:
        $(if [ "${{ needs.status-report.result }}" = "success" ]; then echo "✅ **Completed** - Status report generated"; else echo "❌ **Failed** - Status report generation failed"; fi)

        ### Full System Scan:
        $(if [ "${{ needs.full-system-scan.result }}" = "success" ]; then echo "✅ **Completed** - All scans initiated"; else echo "❌ **Failed** - Scan initiation failed"; fi)

        ### Emergency Repair:
        $(if [ "${{ needs.emergency-repair.result }}" = "success" ]; then echo "✅ **Completed** - Emergency protocols activated"; else echo "❌ **Failed** - Emergency repair failed"; fi)

        ### Security Audit:
        $(if [ "${{ needs.security-audit.result }}" = "success" ]; then echo "✅ **Completed** - Security checks passed"; else echo "❌ **Failed** - Security issues detected"; fi)

        ### Performance Test:
        $(if [ "${{ needs.performance-test.result }}" = "success" ]; then echo "✅ **Completed** - Performance benchmarks completed"; else echo "❌ **Failed** - Performance issues detected"; fi)

        ### Repository Cleanup:
        $(if [ "${{ needs.repository-cleanup.result }}" = "success" ]; then echo "✅ **Completed** - Repository cleaned"; else echo "❌ **Failed** - Cleanup failed"; fi)

        ### Deploy Coordinator:
        $(if [ "${{ needs.deploy-coordinator.result }}" = "success" ]; then echo "✅ **Completed** - Deployment initiated"; else echo "❌ **Failed** - Deployment blocked"; fi)

        ## 🎯 Overall Status:
        $(if [ "$SUCCESS" = true ]; then echo "## ✅ **COMMAND EXECUTION SUCCESSFUL**"; else echo "## ❌ **COMMAND EXECUTION FAILED**"; fi)

        ## 📋 Next Steps:
        $(if [ "$SUCCESS" = true ]; then echo "- Monitor initiated workflows for completion"; else echo "- Review failed jobs and retry if necessary"; fi)
        - Check generated reports and artifacts
        - Address any issues found during execution

        ---
        *Auto-generated by Nuclear MCP Command Center*
        EOF

    - name: 📤 Upload Final Report
      uses: actions/upload-artifact@v3
      with:
        name: nuclear-command-center-report-${{ github.run_id }}
        path: command_center_report.md

    - name: 🔔 Command Center Notification
      if: always()
      run: |
        COMMAND="${{ needs.command-dispatcher.outputs.command }}"
        SUCCESS="${{ job.status }}"

        if [ "$SUCCESS" = "success" ]; then
          echo "🎉 Command Center execution completed successfully"
        else
          echo "⚠️ Command Center execution completed with issues"
          echo "::warning::Command Center execution had failures - check the final report"
        fi

        # Aquí se puede integrar con notificaciones externas
        # Slack, Discord, Teams, email, etc.
