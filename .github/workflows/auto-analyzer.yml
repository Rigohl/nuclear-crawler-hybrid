name: Auto Analyzer (helper location)

# NOTE: GitHub Actions must live in `.github/workflows/` to run.
# The file is created here because the API call to create inside .github/workflows failed; please move the file to .github/workflows/auto_analyzer.yml in the repository root or merge this branch.

on:
  schedule:
    - cron: '0 6 * * *' # daily UTC
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/auto_analyzer/requirements.txt

      - name: Run auto-analyzer
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/auto_analyzer/auto_analyzer.py
