name: Full Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: core Rust must pass before FFI/chapel validation
  rust-gate:
    name: Rust Core (gate)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  chapel-gate:
    name: Chapel 2.8 AI (gate)
    uses: ./.github/workflows/chapel-ai-learning-hub.yml
    needs: rust-gate
    secrets: inherit

  mcp-gate:
    name: MCP 7-Tool (gate)
    uses: ./.github/workflows/mcp-validation.yml
    needs: rust-gate
    secrets: inherit

  ffi-gate:
    name: FFI Validation
    uses: ./.github/workflows/ffi-validation.yml
    needs: chapel-gate
    secrets: inherit

  full-summary:
    name: Full Validation Summary
    runs-on: ubuntu-latest
    needs: [rust-gate, chapel-gate, mcp-gate, ffi-gate]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║          Nuclear Crawler Hybrid — Full Validation    ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║ Rust Core:      ${{ needs.rust-gate.result }}"
          echo "║ Chapel 2.8 AI:  ${{ needs.chapel-gate.result }}"
          echo "║ MCP 7-Tools:    ${{ needs.mcp-gate.result }}"
          echo "║ FFI Backends:   ${{ needs.ffi-gate.result }}"
          echo "╚══════════════════════════════════════════════════════╝"

          # Fail if mandatory jobs failed
          if [ "${{ needs.rust-gate.result }}" != "success" ]; then
            echo "❌ MANDATORY: Rust core failed"
            exit 1
          fi
          if [ "${{ needs.chapel-gate.result }}" != "success" ]; then
            echo "❌ MANDATORY: Chapel 2.8 AI build failed"
            exit 1
          fi
          if [ "${{ needs.mcp-gate.result }}" != "success" ]; then
            echo "❌ MANDATORY: MCP 7-tool validation failed"
            exit 1
          fi
          echo "✅ All mandatory validations passed"
