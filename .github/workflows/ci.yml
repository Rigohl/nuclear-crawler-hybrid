name: Nuclear Crawler Hybrid CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────
  # 1. Core Rust build - MUST PASS
  # ─────────────────────────────────────────────
  build-test:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (no FFI features)
        run: cargo clippy --bins --no-default-features -- -D warnings

      - name: Build release (default features = wasm_ffi off for CI speed)
        run: cargo build --release --no-default-features

      - name: Run tests
        run: cargo test --release --no-default-features

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nuclear-hybrid-linux-x64
          path: |
            target/release/nuclear-mcp
            target/release/nuclear-pro
            target/release/nuclear-lite
            target/release/nuclear-worker
            target/release/nuclear-agent
          retention-days: 30

  # ─────────────────────────────────────────────
  # 2. Security audit - MUST PASS
  # ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  # ─────────────────────────────────────────────
  # 3. Zig SIMD FFI - optional, continue-on-error
  # ─────────────────────────────────────────────
  zig-ffi:
    name: Zig SIMD FFI (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig (latest stable)
        run: |
          ZIG_VERSION=$(curl -s https://ziglang.org/download/index.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(list(d.keys())[1])" 2>/dev/null || echo "0.14.0")
          echo "Using Zig version: $ZIG_VERSION"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz
          sudo mv zig-linux-x86_64-${ZIG_VERSION} /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH
      - name: Build Zig FFI
        working-directory: ffi/wasm/zig
        run: zig build -Doptimize=ReleaseFast
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 4. Nim HTML Parser - optional
  # ─────────────────────────────────────────────
  nim-ffi:
    name: Nim HTML Parser (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Nim
        run: |
          curl -fsSL https://nim-lang.org/choosenim/init.sh | bash -s -- -y
          echo "$HOME/.nimble/bin" >> $GITHUB_PATH
      - name: Build Nim parser
        working-directory: ffi/wasm/nim
        run: nim c -d:release --outdir:./out lib_html_parser.nim
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 5. Go FFI - optional
  # ─────────────────────────────────────────────
  go-ffi:
    name: Go FFI (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Go FFI
        working-directory: ffi/wasm/go
        run: go build -v ./... 2>/dev/null || echo "Go FFI build skipped (no go.mod)"
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 6. JAX validation - optional
  # ─────────────────────────────────────────────
  jax-validate:
    name: JAX ML (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jax jaxlib numpy --quiet
      - run: python -c "import jax; print('JAX OK', jax.__version__)"
        continue-on-error: true
