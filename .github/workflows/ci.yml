# 🔥 NUCLEAR CRAWLER HYBRID - CI/CD Pipeline Empresarial
# Automatiza: Build, Test, Lint, Security Scan, Release

name: 🔥 Nuclear CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🔍 QUALITY CHECK - Lint, Format, Clippy
  # ═══════════════════════════════════════════════════════════════
  quality:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      
      - name: 🎨 Check Format
        run: cargo fmt --all -- --check
      
      - name: 📎 Clippy Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ═══════════════════════════════════════════════════════════════
  # 🧪 TEST - Unit & Integration Tests
  # ═══════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test Suite
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@${{ matrix.rust }}
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 🧪 Run Tests
        run: cargo test --all-features --verbose
      
      - name: 📊 Generate Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo install cargo-tarpaulin --locked || true
          cargo tarpaulin --out Xml --all-features
      
      - name: 📤 Upload Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════
  # 🔒 SECURITY - Audit Dependencies
  # ═══════════════════════════════════════════════════════════════
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔒 Audit Dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # 🏗️ BUILD - Multi-Platform Binaries
  # ═══════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nuclear-mcp.exe
            archive: nuclear-windows-x64.zip
          
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nuclear-mcp
            archive: nuclear-linux-x64.tar.gz
          
          # Linux ARM
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: nuclear-mcp
            archive: nuclear-linux-arm64.tar.gz
          
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: nuclear-mcp
            archive: nuclear-macos-x64.tar.gz
          
          # macOS ARM (M1/M2)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nuclear-mcp
            archive: nuclear-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: 🔧 Install Cross-Compile Tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: 📦 Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: 🏗️ Build Release
        run: cargo build --release --target ${{ matrix.target }} --bin nuclear-mcp
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      
      - name: 📦 Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.archive }} ${{ matrix.binary }}
      
      - name: 📦 Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}
      
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  # 🐳 DOCKER - Multi-Arch Container
  # ═══════════════════════════════════════════════════════════════
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🏷️ Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: 🐳 Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════
  # 🚀 RELEASE - Automatic GitHub Release
  # ═══════════════════════════════════════════════════════════════
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: 📋 Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nuclear Crawler ${{ github.ref_name }}
          body: |
            ## 🔥 Nuclear Crawler Hybrid ${{ github.ref_name }}
            
            ### 📦 Instalación
            
            **Windows:**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nuclear-windows-x64.zip" -OutFile nuclear.zip
            Expand-Archive nuclear.zip -DestinationPath .
            ```
            
            **Linux/macOS:**
            ```bash
            curl -LO "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nuclear-linux-x64.tar.gz"
            tar xzf nuclear-linux-x64.tar.gz
            chmod +x nuclear-mcp
            ```
            
            **Docker:**
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            
            ---
            
            ${{ steps.changelog.outputs.changelog }}
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # 📊 BENCHMARK - Performance Tests
  # ═══════════════════════════════════════════════════════════════
  benchmark:
    name: 📊 Benchmark
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-action@stable
      
      - name: 📊 Run Benchmarks
        run: cargo bench --all-features -- --output-format bencher | tee output.txt
      
      - name: 📈 Store Benchmark Result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
