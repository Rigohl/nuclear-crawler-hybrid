name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run fmt check
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Release
        run: cargo build --release --all-targets

      - name: Run unit tests
        run: cargo test --release --lib

      - name: Run integration tests (REAL MCP Server - No Mocks)
        run: cargo test --test integration_real_mcp --release -- --nocapture --test-threads=1

      - name: Verify MCP Protocol (exactly 5 tools)
        run: cargo test test_exactly_5_tools --release -- --nocapture
