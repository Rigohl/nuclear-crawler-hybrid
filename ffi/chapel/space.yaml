title: Chapel Training Pipeline
description: Continuous learning system for web scraping intelligence - Pure Chapel implementation
sdk: docker
app_file: hf_spaces_app.py
pinned: false
private: true
hardware: cpu-upgrade

# Environment configuration
env:
  - name: CHAPEL_HOME
    value: /opt/chapel
  - name: CHPL_LLVM
    value: bundled
  - name: CHPL_TARGET_CPU
    value: native

# Persistent storage for checkpoints and datasets
persistent_data_dirs:
  - /data/checkpoints
  - /data/datasets
  - /data/logs

# Tags for discoverability
tags:
  - chapel
  - machine-learning
  - web-scraping
  - continuous-learning
  - distributed-training
  - parallel-computing
