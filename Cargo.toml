[package]
name = "nuclear-crawler-hybrid"
version = "0.1.0"
edition = "2021"
authors = ["DELL <nuclear-mcp@localhost>"]
description = "🔥 Nuclear MCP Server - Advanced AI-Powered Web Scraping & File Analysis"
documentation = "https://github.com/Rigohl/nuclear-crawler-hybrid"
repository = "https://github.com/Rigohl/nuclear-crawler-hybrid"
readme = "README.md"
keywords = ["mcp", "http-server", "axum", "websearch", "file-search"]
categories = ["web-programming", "command-line-utilities"]
license = "MIT OR Apache-2.0"

[features]
# FFI toggles: keep defaults off so caller opts-in explicitly
default = []
go_integration = []
nim_integration = []
zig_integration = []
chapel_ffi = []
chromium_rendering = ["chromiumoxide"]
advanced_tor = []
# Advanced feature bundle: enables all advanced capabilities for the multi-agent pipeline
advanced = ["chromium_rendering", "advanced_tor"]

[package.metadata.mcp]
protocol-version = "2026-02-06"
server-mode = ["http"]
default-port = 8079
tools = ["websearch", "premium", "file_search", "scan", "ai_dataset_trainer", "parallel_engine", "osint_intelligence"]

[dependencies]
# HTTP server - ESSENTIAL (with SSE support for MCP 2025)
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1.8", features = ["full"] }
tokio = { version = "1.49", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# CLI and error handling - ESSENTIAL
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# JSON handling - ESSENTIAL
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# Time handling for result saving - USED
chrono = { version = "0.4", features = ["serde"] }

# UUID generation for MCP requests
uuid = { version = "1.20", features = ["v4", "serde"] }

# Hashing - USED
blake3 = "1.8"

# Regular expressions - ESSENTIAL for pattern matching
regex = "1.12"

# Concurrent hashmap - USED extensively
dashmap = "6.1"

# Parallel processing - USED for sorting
rayon = "1.8"

# HTTP client - ESSENTIAL for web search (with SOCKS5 for TOR support)
reqwest = { version = "0.13", features = ["json", "gzip", "blocking", "socks"] }

# URL parsing - ESSENTIAL
url = "2.5"

# Dynamic library loading - ESSENTIAL for FFI
libloading = "0.9"

# LRU cache - USED
lru = "0.16"

# Lazy static - USED
lazy_static = "1.4"

# Parking lot for locks - USED
parking_lot = "0.12"

# HTML scraping - ESSENTIAL for web search
scraper = "0.25"

# Directory walking
walkdir = "2.4"

# Random number generation for stealth
oorandom = "11.1"

# 🔥 NEW: Random number generation for ML algorithms  
rand = "0.9"

# 🔥 NEW: CPU count for parallelization
num_cpus = "1.16"

# URL encoding for headers
urlencoding = "2.1"

# 🔥 NEW: Chrome DevTools Protocol for JavaScript rendering
chromiumoxide = { version = "0.8", optional = true, features = ["fetcher"] }

# 🔥 NEW: HTTP/2 multiplexing support (system-level)
http2 = "0.5"

# 🔥 NEW: Advanced TOR/I2P network routing
tokio-socks = "0.5"

# 🔥 NEW: JAX GPU acceleration bindings
ndarray = "0.17"

# 🔥 NEW: Zero-copy serialization for performance
bincode = "1.3"

# 🔥 NEW: Async runtime utilities
async-trait = "0.1"

# 🔥 NEW: HuggingFace integration for AI training
# HuggingFace API client capabilities
base64 = "0.22"
mime = "0.3"

# 🔥 NEW: Chatbot capabilities
# For chat interface and conversation management
toml = "0.9"

# 🔥 NEW: Tantivy full-text search engine - REAL SEARCH, NO MOCKS
# High-performance search index for web search enhancement
tantivy = "0.22"
tempfile = "3.8"

# 🔥 NEW: WebAssembly runtime for WASM FFI integrations
# wasmtime provides SIMD, bulk-memory, and multi-memory support
wasmtime = "27.0"

[[bin]]
name = "nuclear-mcp"
path = "src/bin/nuclear_mcp.rs"

[[bin]]
name = "nuclear-pro"
path = "src/bin/nuclear_pro.rs"

[[bin]]
name = "nuclear-lite"
path = "src/bin/nuclear_lite.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
