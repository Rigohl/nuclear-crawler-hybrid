[package]
name = "nuclear_crawler_lib"
version = "0.5.0"
edition = "2021"
publish = false

# Registrar cfg personalizados para evitar warnings
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(has_go)', 'cfg(has_zig)', 'cfg(has_nim)'] }

# Features para FFI externo
[features]
default = []
go = []    # Activa FFI a Go (requiere stealth_go.a compilado)
zig = []   # Activa FFI a Zig (requiere nuclear_zig.lib compilado)

[[bin]]
name = "nuclear-mcp"
path = "src/bin/nuclear_ultimate.rs"

[build-dependencies]
cc = "1.2"

[dependencies]
aho-corasick = "1.1"
ammonia = "3.3"
anyhow = "1.0"
arc-swap = "1.7"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.21"
blake3 = "1.8"
brotli = "3.5"
chardet = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
console_error_panic_hook = "0.1"
crossbeam = "0.8"
dashmap = "5.5"
dirs = "5.0"
encoding_rs = "0.8"
env_logger = "0.11"
fancy-regex = "0.11"
feed-rs = "1.5"
flate2 = "1.1"
futures = "0.3"
futures-util = "0.3"
fuzzy-matcher = "0.3"
governor = "0.6"
html5ever = "0.27"
http = "1.4"
http-body-util = "0.1"
idna = "1.0"
js-sys = "0.3"
lazy_static = "1.5"
log = "0.4"
lru = "0.12"
md5 = "0.7"
metrics = "0.22"
metrics-prometheus = "0.5"
num_cpus = "1.17"
once_cell = "1.21"
parking_lot = "0.12"
percent-encoding = "2.3"
rand = "0.8"
rayon = "1.11"
regex = "1.12"
regex-automata = "0.4"
reqwest-middleware = "0.4"
reqwest-retry = "0.7"
roxmltree = "0.19"
rss = "2.0"
scraper = "0.19"
select = "0.6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
strsim = "0.11"
tendril = "0.4"
thiserror = "1.0"
toml = "0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "console", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }
xml-rs = "0.8"
zstd = "0.13"

[dependencies.axum]
version = "0.7"
features = ["json", "multipart", "query", "ws"]

[dependencies.hyper]
version = "1.8"
features = ["full"]

[dependencies.hyper-util]
version = "0.1"
features = ["full"]

[dependencies.indicatif]
version = "0.17"

[dependencies.moka]
version = "0.12"
features = ["future"]

[dependencies.walkdir]
version = "2.4"

[dependencies.reqwest]
version = "0.12"
features = [
    "cookies",
    "json",
    "stream",
    "multipart",
    "blocking",
    "gzip",
    "brotli",
]

[dependencies.rusqlite]
version = "0.32.1"
features = ["bundled"]

[dependencies.tokio]
version = "1.42"
features = ["full"]

[lib]
name = "nuclear_crawler_lib"
path = "src/lib.rs"
